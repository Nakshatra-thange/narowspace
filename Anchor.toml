[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pool_core = "Fn65QSQyWh7w3QmAj3qhdavTd7kGEctTPwr2M8Y1253M"
position_mgr = "4khnPYzUq44fr4WXRGrjbsLtAkK1L1A3K8ydQu1uuV8a"
