[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pool_core = "HSKUQfjfpFKKyRgN1UrtS56Y1GxwCC9JjePsMoXmA2kq"
position_mgr = "C8QYKv68h1gSosFxrQpiZUzRnj2UTaHEYjoZ4rprekYn"
tick_manager = "GdjvKbL12gNDpthqsHwAZmySTZcBzaUj2PKWHVgyPykG"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 60000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
dynamic_port_range = "19004-19100"
faucet_port = 19002
gossip_port = 19003
ledger = ".anchor/test-ledger"
rpc_port = 8899
