[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pool_core = "FYVB5Y9qLfhkfMm9r2TzfdPM8rkyR4gzHZfQsxZdrJMS"
position_mgr = "3XhCVxvUtFBCpcg4TgVJcD8JerSStCDF1cadGVYtVR45"
tick_manager = "Wy4kPFajGnvDFuEEMsdrC8cefytxDja8kpvRfvhzyoD"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 60000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
dynamic_port_range = "19004-19100"
faucet_port = 19002
gossip_port = 19003
ledger = ".anchor/test-ledger"
rpc_port = 8899
